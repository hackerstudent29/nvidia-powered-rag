[providers]
providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc"]

[phases.install]
cmds = [
  "python3 -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate",
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "echo 'Python dependencies installed successfully!'"
]

[start]
cmd = "uvicorn backend.server:app --host 0.0.0.0 --port $PORT --workers 1"
