<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="blobGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Organic Jelly Blob Body -->
  <path d="M 50,10 C 75,10 90,25 90,50 C 90,75 75,90 50,90 C 25,90 10,75 10,50 C 10,25 25,10 50,10 Z" fill="url(#blobGrad)" filter="url(#blobGlow)" />

  <!-- Top 3D Specular Highlight -->
  <path d="M 30,18 C 45,14 65,14 70,18 C 65,26 45,26 30,18 Z" fill="url(#shineGrad)" />

  <!-- Left Eye -->
  <circle cx="36" cy="46" r="6.5" fill="#111827" />
  <circle cx="34" cy="44" r="2.2" fill="#ffffff" />

  <!-- Right Eye -->
  <circle cx="64" cy="46" r="6.5" fill="#111827" />
  <circle cx="62" cy="44" r="2.2" fill="#ffffff" />

  <!-- Cute Smile -->
  <path d="M 42,60 Q 50,68 58,60" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round" />

  <!-- Blush Cheeks -->
  <circle cx="27" cy="54" r="4.5" fill="#f43f5e" opacity="0.3" />
  <circle cx="73" cy="54" r="4.5" fill="#f43f5e" opacity="0.3" />
</svg>