<script>
const map = L.map('map').setView([13.0, 80.19], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const stopsById = {};
window.BUS_DATA.stops.forEach(s => stopsById[s.stop_id] = s);

const palette = ["#e6194B","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6",
                  "#bfef45","#fabed4","#469990","#dcbeff","#9A6324","#800000","#808000",
                  "#000075","#a9a9a9","#e6beff","#000000","#ffd8b1"];

let routeLayers = {};
let stopMarkers = {};
let activeRouteId = null;

// draw a small dot for every unique stop
window.BUS_DATA.stops.forEach(s => {
  const m = L.circleMarker([s.lat, s.lng], {
    radius: 4, color:"#555", weight:1, fillColor:"#fff", fillOpacity:0.9
  });
  m.bindPopup(buildStopPopup(s.stop_id));
  m.addTo(map);
  stopMarkers[s.stop_id] = m;
});

function buildStopPopup(stopId) {
  const s = stopsById[stopId];
  const serving = window.BUS_DATA.routes.filter(r => r.stops.some(st => st.stop_id === stopId));
  let html = `<div class="stop-popup"><b>${s.name}</b>`;
  if (s.confidence === "approx") html += ` <span style="color:#c60;font-size:11px;">(approx location)</span>`;
  html += `<div class="via">Served by:</div>`;
  serving.forEach(r => { html += `<span class="badge">${r.route_id}</span>`; });
  html += `</div>`;
  return html;
}

function colorFor(routeId, idx) { return palette[idx % palette.length]; }

function drawRoute(route, idx) {
  const latlngs = route.stops.map(s => [stopsById[s.stop_id].lat, stopsById[s.stop_id].lng]);
  const layer = L.polyline(latlngs, { color: colorFor(route.route_id, idx), weight: 4, opacity: 0.85 });
  layer.bindTooltip(route.name, {sticky:true});
  return layer;
}

function clearActive() {
  Object.values(routeLayers).forEach(l => map.removeLayer(l));
  routeLayers = {};
  document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
}

function showRoute(route, idx, el) {
  clearActive();
  const layer = drawRoute(route, idx);
  layer.addTo(map);
  routeLayers[route.route_id] = layer;
  map.fitBounds(layer.getBounds(), {padding:[30,30]});
  if (el) el.classList.add('active');
  activeRouteId = route.route_id;
}

const collegeList = document.getElementById('collegeList');
const publicList = document.getElementById('publicList');

window.BUS_DATA.routes.forEach((route, idx) => {
  const item = document.createElement('div');
  item.className = 'route-item';
  item.innerHTML = `<span class="swatch" style="background:${colorFor(route.route_id, idx)}"></span>${route.name}`;
  item.onclick = () => showRoute(route, idx, item);
  if (route.category === 'college') collegeList.appendChild(item);
  else publicList.appendChild(item);
});

// simple stop search
document.getElementById('stopSearch').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  results.innerHTML = '';
  if (!q) return;
  const matches = window.BUS_DATA.stops.filter(s =>
    s.name.toLowerCase().includes(q) || (s.aliases||[]).some(a => a.toLowerCase().includes(q))
  ).slice(0, 8);
  matches.forEach(s => {
    const el = document.createElement('div');
    el.className = 'route-item';
    el.textContent = s.name;
    el.onclick = () => {
      map.setView([s.lat, s.lng], 15);
      stopMarkers[s.stop_id].openPopup();
    };
    results.appendChild(el);
  });
});

// start on the first college route
showRoute(window.BUS_DATA.routes[0], 0);
</script>
